<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lullaby</title>
    <link rel="icon" type="image/png" href="/lullaby.png" />
    <link rel="apple-touch-icon" href="/lullaby.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("rnd.theme:v1") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
