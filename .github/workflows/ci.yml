name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Deno module cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json', 'deno.lock', 'web/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Install client deps
        run: npm --prefix web ci
      - name: Verify (build, check, lint, fmt, deno test, web typecheck, web vitest)
        run: deno task verify
